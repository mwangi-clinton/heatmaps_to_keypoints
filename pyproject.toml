[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.9.0", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "heatmaps_to_keypoints"
version = "0.0.2"
authors = [{ name = "Mwangi Kuya" }]
description = "Fast C++ heatmap-to-keypoints decoder for 2D human pose estimation."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["opencv-python >= 4.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
