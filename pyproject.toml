[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heatmaps_to_keypoints"
version = "0.1.0"      # Start with 0.1.0
authors = [{ name = "Mwangi Kuya" }]
description = "Keypoint detection from heatmaps"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["opencv-python >= 4.0"]  # Declare OpenCV dep

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
# Extension modules are declared in setup.py (setup.py uses pybind11.get_include()
# and configures the extension name `my_keypoints.bindings`).