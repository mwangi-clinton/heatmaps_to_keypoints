name: Build Wheels

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install opencv pkg-config

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          # Skip PyPy (pp*) and musllinux (Alpine) as Torch support is limited/complex
          CIBW_SKIP: "pp* *musllinux*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"

          # OPTIMIZATION: Install CPU-only Torch on Linux/Windows to save bandwidth
          # Standard install on Mac (no CPU-specific index usually needed/available in same way)
          CIBW_BEFORE_BUILD: "pip install torch==2.5.1"
          CIBW_BEFORE_BUILD_LINUX: "pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu"

          # Platform-specific compiler flags
          # Linux: Use old ABI for PyTorch compatibility
          CIBW_ENVIRONMENT_LINUX: "CXXFLAGS='-O3 -D_GLIBCXX_USE_CXX11_ABI=0'"
          # macOS: Only optimization, no ABI flag (uses libc++ not libstdc++)
          CIBW_ENVIRONMENT_MACOS: "CXXFLAGS='-O3'"
          # Windows: Use MSVC optimization
          CIBW_ENVIRONMENT_WINDOWS: "CXXFLAGS='/O2'"

          # CRITICAL: Exclude libtorch from being bundled (Linux)
          # We manually rename the wheel to manylinux tags to allow upload to PyPI,
          # as we skip auditwheel to avoid bundling the massive PyTorch libraries.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            mkdir -p {dest_dir} &&
            fname=$(basename {wheel}) &&
            echo "Renaming $fname..." &&
            if [[ "$fname" == *"x86_64"* ]]; then
              new_fname=$(echo $fname | sed 's/linux_x86_64/manylinux2014_x86_64/')
            elif [[ "$fname" == *"aarch64"* ]]; then
              new_fname=$(echo $fname | sed 's/linux_aarch64/manylinux_2_28_aarch64/')
            else
              new_fname=$fname
            fi &&
            cp {wheel} {dest_dir}/$new_fname

          # CRITICAL: macOS 'delocate' also tries to bundle libtorch and fails/bloats.
          # There is no simple --exclude for delocate, so we SKIP repair for macOS.
          # We just copy the wheel to the destination. PyTorch extensions rely on user's installed torch.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel -w {dest_dir} {wheel}

          # REQUIRED: Test the wheel works
          # We install CPU-only torch manually to avoid downloading 2GB+ CUDA libs on Linux/Win
          CIBW_BEFORE_TEST: "pip install torch==2.5.1"
          CIBW_BEFORE_TEST_LINUX: "pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu"
          CIBW_BEFORE_TEST_WINDOWS: "pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu"

          CIBW_TEST_COMMAND: "python {project}/tests/import_test.py"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          # Download all artifacts to 'dist'; creates subdirs based on artifact names
          path: dist
          merge-multiple: true # Flattens the file structure so all .whl are in dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          attestations: false
