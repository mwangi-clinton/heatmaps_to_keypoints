name: Build Wheels

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install opencv --version=4.9.0 --params "/InstallationPath:C:\\opencv /Environment"
          choco install pkgconfiglite  # Optional if fallback works
          pip install delvewheel

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install opencv@4 pkg-config

      - name: Add OpenCV DLL to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $dll_path = (Get-ChildItem -Path C:\ -Filter "opencv_world*490*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          echo "Found OpenCV DLL at: $dll_path"
          echo "$dll_path" >> $env:GITHUB_PATH

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp* *musllinux*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"

          # Install OpenCV in the manylinux container
          CIBW_BEFORE_ALL_LINUX: "dnf install -y epel-release && dnf install -y --enablerepo=powertools opencv opencv-devel pkgconf"

          # No Torch install for build
          CIBW_BEFORE_BUILD: "pip install pybind11" # Ensure pybind11 is available if needed

          # Compiler flags (no Torch ABI specifics)
          CIBW_ENVIRONMENT_LINUX: "CXXFLAGS='-O3'"
          CIBW_ENVIRONMENT_MACOS: "CXXFLAGS='-O3'"
          CIBW_ENVIRONMENT_WINDOWS: "CXXFLAGS='/O2'"

          # Linux: Simple auditwheel (no Torch to skip bundling)
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"

          # macOS: delocate
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel -w {dest_dir} {wheel}"

          # Windows: delvewheel relies on the customized PATH from the previous step
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"


      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          attestations: false
